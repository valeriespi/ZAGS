name: ZAGS autotests

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      STAND_USER: ${{ secrets.STAND_USER }}
      STAND_PASSWORD: ${{ secrets.STAND_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        working-directory: project
        run: ./gradlew test --no-daemon

      - name: Pack Allure report
        if: always()
        run: zip -r allure-report.zip project/build/reports/allure-report/allureReport/awesome

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.zip

      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "ZAGS autotests ${{ job.status }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USER }}
          body: "Scheduled run finished with status: ${{ job.status }}. Allure report is attached."
          attachments: allure-report.zip
