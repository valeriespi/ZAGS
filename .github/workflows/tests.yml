name: ZAGS autotests

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  tests:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    env:
      STAND_USER: ${{ secrets.STAND_USER }}
      STAND_PASSWORD: ${{ secrets.STAND_PASSWORD }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check stand access
        run: |
          $code = curl.exe -s -o NUL -w "%{http_code}" -u "${env:STAND_USER}:${env:STAND_PASSWORD}" https://regoffice.senla.eu/
          "Stand response: $code"

      - name: Run tests
        working-directory: project
        run: .\gradlew.bat test -Dselenoid=true --no-daemon

      - name: Diagnostics on failures
        if: failure()
        run: |
          $files = Get-ChildItem 'project/build/test-results/test/TEST-*.xml' -ErrorAction SilentlyContinue
          if ($files) {
            $files | Select-String -Pattern '<failure message="[^"]*' | Select-Object -First 6 | ForEach-Object { $_.Line.Trim() }
          } else {
            'no test results'
          }

      - name: Pack Allure report
        if: always()
        run: |
          if (Test-Path 'project/build/reports/allure-report/allureReport') {
            Compress-Archive -Path 'project/build/reports/allure-report/allureReport' -DestinationPath 'allure-report.zip' -Force
          } else {
            'no report to pack'
          }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.zip
          if-no-files-found: ignore

      - name: Send report by email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "ZAGS autotests ${{ job.status }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USER }}
          body: "Scheduled run finished with status: ${{ job.status }}. Download the allure-report artifact on the run page: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
